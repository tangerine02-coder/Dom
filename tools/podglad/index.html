<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#dfe7ee;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from './node_modules/three/build/three.module.js';
const q = new URLSearchParams(location.search);
const data = await (await fetch(q.get('mesh')||'mesh.json')).json();
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
r.setSize(W,H); r.setPixelRatio(devicePixelRatio); document.body.appendChild(r.domElement);
r.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdfe7ee);
const hide = (q.get('hide')||'').split(',').filter(Boolean);
const side = q.get('double') ? THREE.DoubleSide : THREE.FrontSide;
const mats = {};
for (const [n,m] of Object.entries(data.materials)) {
  const c = new THREE.Color(m.rgb[0]/255, m.rgb[1]/255, m.rgb[2]/255);
  mats[n] = new THREE.MeshLambertMaterial({color:c, side, transparent:m.alpha<1, opacity:m.alpha, depthWrite:m.alpha>=1});
}
const root = new THREE.Group(); scene.add(root);
for (const p of data.parts) {
  if (hide.includes(p.layer)) continue;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p.pos,3));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, mats[p.mat]||mats['Domyślny']);
  mesh.castShadow = p.layer!=='Teren'; mesh.receiveShadow = true;
  root.add(mesh);
  if (p.layer!=='Teren' && p.mat!=='Szkło') {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), new THREE.LineBasicMaterial({color:0x222222, transparent:true, opacity:0.55}));
    root.add(e);
  }
}
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a7a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(...JSON.parse(q.get('sun')||'[-900,-1400,1800]')); sun.target.position.set(533,414,0); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-1200,right:1200,top:1200,bottom:-1200,near:100,far:6000});
sun.shadow.bias = -0.0005;
scene.add(sun);
const e = JSON.parse(q.get('eye')), t = JSON.parse(q.get('target')), up = JSON.parse(q.get('up')||'[0,0,1]');
let cam;
if (q.get('ortho')) { const h = +q.get('ortho'); cam = new THREE.OrthographicCamera(-h*W/H/2, h*W/H/2, h/2, -h/2, 1, 20000); }
else cam = new THREE.PerspectiveCamera(+(q.get('fov')||35), W/H, 10, 30000);
cam.up.set(...up); cam.position.set(...e); cam.lookAt(...t);
r.render(scene, cam);
document.title = 'done';
</script></body></html>
